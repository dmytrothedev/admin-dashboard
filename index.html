<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">   
    <title>Admin Dashboard</title>
</head>
<body>
    <div class="sidebar"> 
        <div class="sidebar-header">
            <h1><img src="./images/sidebar/view-dashboard.svg" alt="Dashboard icon" width="60" height="60">Dashboard</h1>   
        </div>
        <div class="sidebar-main">
            <h2><img src="./images/sidebar/main-buttons/home-variant-outline.svg" alt="Home icon" width="30" height="30">Home</h2>
            <h2><img src="./images/sidebar/main-buttons/profile.svg" alt="Profile icon" width="30" height="30">Profile</h2>
            <h2><img src="./images/sidebar/main-buttons/message.svg" alt="Message icon" width="30" height="30">Messages</h2>
            <h2><img src="./images/sidebar/main-buttons/history.svg" alt="History icon" width="30" height="30">History</h2>
            <h2><img src="./images/sidebar/main-buttons/tasks.svg" alt="Tasks icon" width="30" height="30">Tasks</h2>
            <h2><img src="./images/sidebar/main-buttons/communities.svg" alt="Communities icon" width="30" height="30">Communities</h2>
        </div>
        <div class="sidebar-additional">
            <h2><img src="./images/sidebar/additional-buttons/settings.svg" alt="Settings icon" width="30" height="30">Settings</h2>
            <h2><img src="./images/sidebar/additional-buttons/support.svg" alt="Support icon" width="30" height="30">Support</h2>
            <h2><img src="./images/sidebar/additional-buttons/privacy.svg" alt="Privacy icon" width="30" height="30">Privacy</h2>
        </div>
    </div>
    <div class="header">
        <div class="search">
            <img src="./images/other/search.svg" alt="Privacy icon" width="30" height="30"><input type="text">
        </div>
        <div class="greeting">
            <div>Hi there,</div>
            <h2><img src="./images/profile-pictures/elliot.jpg" alt="Profile picture of Elliot Alderson" width="50" height="50">Elliot Alderson</h2>
        </div>
        <div class="profile-shortcut">
            <img src="./images/other/bell.svg" alt="Profile picture of Elliot Alderson" width="50" height="50">
            <span><img src="./images/profile-pictures/elliot.jpg" alt="Profile picture of Elliot Alderson" width="50" height="50">Elliot Alderson</span>
        </div>
        <div class="actions">
            <button>New</button>
            <button>Upload</button>
            <button>Share</button>
        </div>
    </div>

    <div class="content">

    </div>

</body>
</html>
