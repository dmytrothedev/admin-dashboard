<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">   
    <title>Admin Dashboard</title>
</head>
<body>
    <div class="sidebar">

        </div>
        <div class="sidebar-main">

            <h2><img src="./images/sidebar/additional-buttons/support.svg" alt="Dashboard icon" width="30" height="30">Support</h2>
